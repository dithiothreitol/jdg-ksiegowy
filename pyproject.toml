[project]
name = "jdg-ksiegowy"
version = "1.0.1"
description = "AI Asystent Ksiegowy JDG — faktury, KSeF, JPK, podatki"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "holidays>=0.108",
    "httpx>=0.28.1",
    "ksef2>=1.3.0",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.1",
    "tzdata>=2026.1 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
    "xmlschema>=4.3.2",
]

[project.scripts]
jdg = "jdg_ksiegowy.cli.main:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdg_ksiegowy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
# pydantic: @computed_field nad @property to wzorzec z dokumentacji, mypy go nie rozumie
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "sandbox: e2e na srodowiskach testowych KSeF / MF (siec; uruchamiane jawnie: -m sandbox)",
]
addopts = "-m 'not sandbox'"
